      var head = document.head, body = document.body;
      if (head && !head.querySelector('meta[name="robots"]')) {
        var m = document.createElement("meta");
        m.name = "robots"; m.content = "noindex, nofollow";
        head.appendChild(m);

        "text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.25)";
      body.appendChild(d);
      fit();
    }
    function fit() {
      var d = document.getElementById("jv-proto-banner");
      if (d) document.documentElement.style.paddingTop = d.offsetHeight + "px";

      // which transformScriptTags handles unconditionally.
